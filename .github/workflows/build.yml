name: Build

# Unit tests and the signed release APK, the end-to-end test on an emulator (real Health Connect -> app ->
# exporter -> Prometheus, which also refreshes the README screenshots), then a release when both pass.
# Every green push to main is released as v<VERSION>.<run number> (docs/adr/0012-automatic-releases.md);
# the release is created in this same run because tags created with GITHUB_TOKEN don't trigger workflows.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

# Actions are pinned to commit SHAs (tag in the comment). The signing secrets are only in the build job,
# which can't write to the repository. Only the release and screenshots jobs can write, and they never
# see the secrets; screenshots runs no build or test code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signer: ${{ steps.signer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            name="$(tr -d '[:space:]' < VERSION).$GITHUB_RUN_NUMBER"
          else
            name="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Releases (main and tags) must be signed with the release key: a debug key changes on every build,
      # so updates would fail to install over the previous version.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            echo "::error::Releases must be signed with the release key. Set the repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD (see README, Release signing)."
            exit 1
          else
            echo "::warning::No signing secrets configured; release APK is signed with the debug key."
          fi

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Surfaces results as annotations, readable without downloading logs.
      - name: Report test results
        if: always()
        run: python3 .github/report_tests.py "$RUNNER_TEMP/test.log" app/build/test-results

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "health-connect-bridge-$VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      # Lets users check the APK's signer before installing (apksigner from the runner's Android SDK).
      - name: Signer certificate
        id: signer
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          certs=$("$apksigner" verify --print-certs "health-connect-bridge-$VERSION_NAME.apk" 2>&1) || true
          # e.g. "Signer #1 certificate SHA-256 digest: <hex>" or "V2 Signer: certificate SHA-256 digest: <hex>".
          sha256=$(echo "$certs" | grep -i -m 1 'certificate SHA-256 digest:' | sed 's/.*[Dd]igest: *//')
          if [ -z "$sha256" ]; then
            echo "::error title=apksigner ($apksigner)::$(echo "$certs" | head -n 20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Signer certificate SHA-256: \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-connect-bridge-${{ env.VERSION_NAME }}
          path: health-connect-bridge-${{ env.VERSION_NAME }}.apk

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deliberately the exporter's latest main (same owner), so the E2E test runs against what is deployed next.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MateuxLucax/health-connect-prometheus-exporter
          ref: main
          path: exporter
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: exporter/go.mod
          cache: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate token
        run: |
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "AUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Start Prometheus
        run: |
          cd "$RUNNER_TEMP"
          release=https://github.com/prometheus/prometheus/releases/download/v3.5.0
          curl -sSfLO "$release/prometheus-3.5.0.linux-amd64.tar.gz"
          curl -sSfLO "$release/sha256sums.txt"
          grep " prometheus-3.5.0.linux-amd64.tar.gz$" sha256sums.txt | sha256sum -c
          tar xzf prometheus-3.5.0.linux-amd64.tar.gz
          cd "$GITHUB_WORKSPACE"
          # exporter/prometheus.yml sets storage.tsdb.out_of_order_time_window: 30d.
          nohup "$RUNNER_TEMP/prometheus-3.5.0.linux-amd64/prometheus" --config.file=exporter/prometheus.yml \
            --storage.tsdb.path="$RUNNER_TEMP/prometheus-data" --web.enable-remote-write-receiver \
            --web.listen-address=0.0.0.0:9090 > "$RUNNER_TEMP/prometheus.log" 2>&1 &
          curl -sSf --retry 30 --retry-delay 1 --retry-all-errors http://localhost:9090/-/ready

      - name: Start exporter
        working-directory: exporter
        env:
          REMOTE_WRITE_URL: http://localhost:9090/api/v1/write
          LISTEN_ADDR: 0.0.0.0:8080
        run: |
          go build -o "$RUNNER_TEMP/exporter" .
          nohup "$RUNNER_TEMP/exporter" > "$RUNNER_TEMP/exporter.log" 2>&1 &
          curl -sSf --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz

      # The emulator reaches the host's exporter and Prometheus at 10.0.2.2.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # The API 37 image (android-37.0, the app's targetSdk) boots, but its system_server keeps
          # restarting on the runner, so installs fail. 36 is the newest stable one.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          script: |
            bash -o pipefail -c './gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.token="$AUTH_TOKEN" 2>&1 | tee "$RUNNER_TEMP/test.log"; s=$?; adb logcat -d > "$RUNNER_TEMP/logcat.txt"; exit $s'
            mkdir -p docs
            adb pull /data/local/tmp/screenshots docs/

      - name: Report test results
        if: always()
        run: python3 .github/report_tests.py "$RUNNER_TEMP/test.log" app/build/outputs/androidTest-results "Instrumented tests"

      - name: Report server and device logs
        if: failure()
        run: |
          annotate() { echo "::warning title=$1::$(tail -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; }
          annotate "Exporter log" < "$RUNNER_TEMP/exporter.log" || true
          annotate "Prometheus log" < "$RUNNER_TEMP/prometheus.log" || true
          grep -E "TestRunner|AndroidRuntime|HealthConnect|healthconnectbridge" "$RUNNER_TEMP/logcat.txt" | annotate "Logcat" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error

  # Commits the screenshots taken by the integration job. Runs one at a time; each attempt starts from
  # the latest main, so concurrent runs don't conflict. The commit has [skip ci], so it doesn't release.
  screenshots:
    needs: integration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: screenshots
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p docs/screenshots
            cp -r "$RUNNER_TEMP/screenshots/." docs/screenshots/
            git add docs/screenshots
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Update screenshots [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

  # Publishes the APK once the unit tests, the build and the end-to-end test passed.
  release:
    needs: [build, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
      APK: health-connect-bridge-${{ needs.build.outputs.version }}.apk
      SIGNER_NOTE: "APK signer certificate SHA-256: `${{ needs.build.outputs.signer }}`"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: health-connect-bridge-${{ needs.build.outputs.version }}

      # The release may already exist: drafted and published in the GitHub UI for a manual tag, or created by
      # an earlier attempt of this run. On main, the tag v<VERSION>.<run number> is created at this commit.
      - name: Publish GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            notes=$(gh release view "$TAG" --json body --jq .body)
            if [[ "$notes" != *"$SIGNER_NOTE"* ]]; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$notes" "$SIGNER_NOTE")"
            fi
          else
            # GitHub puts --notes before the generated notes.
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "$SIGNER_NOTE"
          fi
